<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cryptography Key Management - Login</title>

<style>
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    height:100vh;
    background-image:url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .container{
    width:420px;
    padding:40px;
    border-radius:14px;
    background:rgba(0,0,0,0.72);
    color:#fff;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  h2{
    text-align:center;
    margin:0 0 18px 0;
    letter-spacing:.4px;
  }

  .subtitle{
    text-align:center;
    margin:0 0 22px 0;
    color:#d9d9d9;
    font-size:14px;
  }

  label{
    display:block;
    margin-top:10px;
    font-size:14px;
    color:#e9e9e9;
  }

  input{
    width:100%;
    padding:10px 12px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
    box-sizing:border-box;
  }

  .row{
    position:relative;
  }

  .toggle-btn{
    position:absolute;
    right:10px;
    top:36px;
    border:none;
    background:transparent;
    color:#00c6ff;
    cursor:pointer;
    font-size:13px;
  }

  .msg{
    background:rgba(6, 214, 160, 0.15);
    border:1px solid rgba(6, 214, 160, 0.35);
    padding:10px;
    border-radius:10px;
    text-align:center;
    margin-bottom:14px;
    font-size:14px;
    color:#bfffe9;
  }

  .error{
    background:rgba(255, 77, 77, 0.12);
    border:1px solid rgba(255, 77, 77, 0.35);
    padding:10px;
    border-radius:10px;
    text-align:center;
    margin-bottom:14px;
    font-size:14px;
    color:#ffd1d1;
    display:none;
  }

  .hint{
    font-size:12px;
    margin-top:8px;
    color:#cfcfcf;
  }

  .invalid{
    outline:2px solid rgba(255, 77, 77, 0.6);
  }

  button[type="submit"]{
    width:100%;
    padding:12px;
    margin-top:16px;
    background:#00c6ff;
    border:none;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
    transition:0.25s;
  }

  button[type="submit"]:hover{
    background:#0094cc;
    transform:scale(1.01);
  }

  .footer-text{
    text-align:center;
    margin-top:14px;
    color:#eaeaea;
    font-size:14px;
  }

  a{
    color:#00c6ff;
    text-decoration:none;
  }

  .topbar{
    position:absolute;
    top:16px;
    left:18px;
    color:#fff;
    font-size:14px;
    opacity:.9;
  }
  .topbar a{ color:#fff; text-decoration:none; border-bottom:1px dotted rgba(255,255,255,0.6); }

</style>
</head>

<body>

<div class="topbar">
  <a href="/">← Home</a>
</div>

<div class="container">
  <h2>User Login</h2>
  <p class="subtitle">Cryptography Key Management System</p>

  {% if msg %}
    <div class="msg"><b>{{ msg }}</b></div>
  {% endif %}

  <div class="error" id="errBox"><b>Please enter valid username and password.</b></div>

  <form method="POST" id="loginForm" novalidate>
    {% csrf_token %}

    <label>Username</label>
    <input type="text" id="username" name="t1" required minlength="3" maxlength="30" placeholder="Enter username">

    <label>Password</label>
    <div class="row">
      <input type="password" id="password" name="t2" required minlength="6" placeholder="Enter password">
      <button type="button" class="toggle-btn" id="togglePwd">Show</button>
    </div>

    <div class="hint">Tip: Use “Show” to confirm your password before login.</div>

    <button type="submit">Login</button>
  </form>

  <div class="footer-text">
    New user? <a href="{% url 'signup' %}">Create account</a>
  </div>
</div>

<script>
  const form = document.getElementById("loginForm");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const togglePwd = document.getElementById("togglePwd");
  const errBox = document.getElementById("errBox");

  // Show/Hide password
  togglePwd.addEventListener("click", () => {
    const isHidden = password.type === "password";
    password.type = isHidden ? "text" : "password";
    togglePwd.textContent = isHidden ? "Hide" : "Show";
  });

  function invalidate(el, bad){
    if(bad) el.classList.add("invalid");
    else el.classList.remove("invalid");
  }

  function validate(){
    // username: letters/numbers/_ 3-30
    const u = username.value.trim();
    const p = password.value;

    const okUser = /^[a-zA-Z0-9_]{3,30}$/.test(u);
    const okPwd  = (p.length >= 6);

    invalidate(username, !okUser);
    invalidate(password, !okPwd);

    return okUser && okPwd;
  }

  // live hide error box on input
  username.addEventListener("input", () => { errBox.style.display="none"; validate(); });
  password.addEventListener("input", () => { errBox.style.display="none"; validate(); });

  // submit validation
  form.addEventListener("submit", (e) => {
    if(!validate()){
      e.preventDefault();
      errBox.style.display = "block";
      const firstInvalid = form.querySelector(".invalid");
      if(firstInvalid) firstInvalid.focus();
    }
  });
</script>

</body>
</html>
