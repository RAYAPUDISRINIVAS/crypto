databases:
  - name: crypto-key-management-db
    databaseName: crypto_key_management
    user: crypto_key_management
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: crypto-key-management
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py ensure_keyapp_schema && python -m gunicorn Key.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-key-management-db
          property: connectionString
      - key: KEYAPP_MASTER_KEY
        sync: false
